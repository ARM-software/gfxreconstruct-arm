apply plugin: 'com.android.application'

android {
    def propMaxThreadsPerBuildTask = providers.gradleProperty("MaxThreadsPerBuildTask")

    compileSdkVersion 34
    namespace = 'com.lunarg.gfxreconstruct.replay'
    ndkVersion = '26.3.11579264'
    defaultConfig {
        applicationId "com.lunarg.gfxreconstruct.replay"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        ndk {
            if (providers.gradleProperty("armeabi-v7a").present) {
                abiFilters 'armeabi-v7a'
            } else if (providers.gradleProperty("arm64-v8a").present) {
                abiFilters 'arm64-v8a'
            } else if (providers.gradleProperty("x86").present) {
                abiFilters 'x86'
            } else if (providers.gradleProperty("x86_64").present) {
                abiFilters 'x86_64'
            } else {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions", "-Wno-nullability-completeness"
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_STL=c++_static"

                if (propMaxThreadsPerBuildTask.present) {
                    arguments.add("-DCMAKE_JOB_POOL_COMPILE:STRING=build")
                    arguments.add("-DCMAKE_JOB_POOL_LINK:STRING=build")
                    arguments.add("-DCMAKE_JOB_POOLS:STRING=build=${propMaxThreadsPerBuildTask.get()}")
                }

                if (providers.gradleProperty("EnableCcache").present) {
                    arguments.add("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
                    arguments.add("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
                }
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('../../keystore')
            storePassword 'GfxReconKey'
            keyAlias 'key-gfxrecon'
            keyPassword 'GfxReconKey'
        }
        release {
            storeFile file('../../keystore')
            storePassword 'GfxReconKey'
            keyPassword 'GfxReconKey'
            keyAlias 'key-gfxrecon'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable true
            signingConfig signingConfigs.release
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    androidResources {
        ignoreAssetsPattern = "XrLayer_gfxreconstruct.json"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def buildType = variant.buildType.capitalize()
        def (versionName, versionCode) = rootProject.ext.getGfxreconVersionInfo(buildType)
        variant.outputs.each { output ->
            output.versionName.set(versionName)
            output.versionCode.set(versionCode)
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation project(':layer')
}
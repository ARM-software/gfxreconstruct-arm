apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    ndkVersion '22.1.7171670'
    defaultConfig {
        applicationId "com.lunarg.gfxreconstruct.replay"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "${System.env.GFXRECON_INTERNAL_VERSION}"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions", "-std=c++14", "-Wno-nullability-completeness"
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_STL=c++_static", "-DGFXRECON_PROJECT_VERSION_DESIGNATION=-${System.env.GFXRECON_INTERNAL_VERSION}"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('keystore')
            storePassword 'GfxReconKey'
            keyAlias 'key-gfxrecon'
            keyPassword 'GfxReconKey'
        }
        release {
            storeFile file('keystore')
            storePassword 'GfxReconKey'
            keyPassword 'GfxReconKey'
            keyAlias 'key-gfxrecon'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:27.1.1'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation project(':layer')
    implementation fileTree(dir: "libs", include: ["libVkLayer_*.so"])
}
